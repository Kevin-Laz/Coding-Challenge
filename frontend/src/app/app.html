<div class="layout-root">
  <app-header
    (openAuthModal)="api.requestAuthModal()"
    (logout)="onLogout()"
    (checkHealth)="onCheckHealth()"
  />

  <main class="main-content">
    <router-outlet />
  </main>

  <app-auth-modal
    [visible]="api.authModalRequested()"
    (close)="api.authModalRequested.set(false)"
  />
</div>
