<header class="header">
  <div class="brand">
    <span class="brand-title">{{ text.BRAND_TITLE }}</span>
    <span class="brand-subtitle">{{ text.BRAND_SUBTITLE }}</span>
  </div>

  <div class="header-actions">
    <div class="health-monitor">
      <div
        class="health-badge"
        [class.healthy]="api.gatewayHealth().status === 'healthy'"
        [class.unhealthy]="api.gatewayHealth().status === 'unhealthy'"
        [class.checking]="api.gatewayHealth().status === 'checking'"
      >
        <span class="dot"></span>
        <span class="badge-text">
          <span class="label">{{ text.GATEWAY_LABEL }}</span>
          @if (api.gatewayHealth().latencyMs) {
            <span class="latency">({{ api.gatewayHealth().latencyMs }}ms)</span>
          }
        </span>
      </div>

      <div
        class="health-badge"
        [class.healthy]="api.goHealth().status === 'healthy'"
        [class.unhealthy]="api.goHealth().status === 'unhealthy'"
        [class.checking]="api.goHealth().status === 'checking'"
      >
        <span class="dot"></span>
        <span class="badge-text">
          <span class="label">{{ text.QR_LABEL }}</span>
          @if (api.goHealth().latencyMs) {
            <span class="latency">({{ api.goHealth().latencyMs }}ms)</span>
          }
        </span>
      </div>

      <button
        type="button"
        class="btn btn-ghost btn-icon-reload"
        (click)="onCheckHealth()"
        [title]="text.RELOAD_TITLE"
        [attr.aria-label]="text.RELOAD_ARIA"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </button>
    </div>

    <div class="auth-section">
      @if (api.token()) {
        <div class="auth-active">
          <span class="auth-indicator"></span>
          <span class="auth-label">{{ text.AUTH_ACTIVE }}</span>
        </div>
        <button class="btn btn-outline btn-sm" (click)="onLogout()">{{ text.LOGOUT_BTN }}</button>
      } @else {
        <button class="btn btn-primary btn-sm" (click)="onOpenAuth()">{{ text.LOGIN_BTN }}</button>
      }
    </div>
  </div>
</header>
