<div class="layout-root">
  <app-header
    (openAuthModal)="api.requestAuthModal()"
    (logout)="onLogout()"
    (checkHealth)="onCheckHealth()"
  />

  @if (api.errorMessage()) {
    <div class="global-error">
      <span class="global-error-title">Error:</span>
      {{ api.errorMessage() }}
      <button class="error-dismiss" (click)="onError(null)" aria-label="Cerrar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  }

  <main class="main-content">
    <router-outlet />
  </main>

  <app-auth-modal
    [visible]="api.authModalRequested()"
    (close)="api.authModalRequested.set(false)"
  />
</div>
